{% extends "base.html" %}{% block title %}设置 · AlgoRecall{% endblock %}{% block content %}<div class="page-head"><div><p class="eyebrow">Preferences</p><h1>设置</h1><p>当前 v1 使用固定状态机；这里保存下一版本可用的自定义周期。</p></div></div>{% if saved %}<div class="success">设置已保存。</div>{% endif %}<form method="post" class="card settings-form"><h2>复习周期（自然日）</h2><div class="form-grid"><label>Red<input type="number" min="1" name="red_interval" value="{{ settings.red_interval }}"></label><label>首次 Yellow<input type="number" min="1" name="yellow_first_interval" value="{{ settings.yellow_first_interval }}"></label><label>连续 Yellow<input type="number" min="1" name="yellow_repeat_interval" value="{{ settings.yellow_repeat_interval }}"></label><label>首次 Green<input type="number" min="1" name="green_first_interval" value="{{ settings.green_first_interval }}"></label><label>连续 Green<input type="number" min="1" name="green_second_interval" value="{{ settings.green_second_interval }}"></label></div><hr><h2>通知偏好</h2><label class="check"><input type="checkbox" name="notifications_enabled" {% if settings.notifications_enabled %}checked{% endif %}> 启用系统通知（预留）</label><label>通知时间<input type="time" name="notification_time" value="{{ settings.notification_time }}"></label><div class="form-actions"><button class="btn primary">保存设置</button></div></form>{% endblock %}
